# Saved Jira queries. Read by participant/skills/jira-query-stories/run_query.py.
#
# To change a query, add one, or change the page size: edit this file. No code changes.
# Each query has a name, a purpose in words, and a filter. The tool wraps the filter so that it stays
# inside the project named on the command line, and orders the results by key:
#
#     project = "KEY" AND (the filter) ORDER BY key ASC
#
# A filter may have one or more blanks, written {name}, each declared under `parameters` as a date.
# The value is given when the query is run:  --set since=2026-11-01
# Write a blank without quotes round it. The tool checks the value is a real date and adds the quotes.
#
# HOW TO WRITE THIS FILE. The tool reads a small, strict part of YAML and refuses anything else, naming the line.
#   - Keep the layout below: two spaces before `- name:`, four before `purpose:`, `filter:` and `parameters:`,
#     six before a parameter. No tabs.
#   - A name is lower-case letters, digits and dashes. A purpose is a sentence, not a word.
#   - Put a filter in single quotes. Inside it use double quotes for values: 'status = "To Do"'.
#   - A comment goes on a line of its own, not after a value.
#   - A filter may not have a backslash in it, or the words ORDER BY.
#   - Each blank is used once in its filter.
#
# HOW TO TRY A NEW QUERY. The made-up Jira used by the tests understands only a few kinds of clause, joined by AND
# (see skills/jira-query-stories/fake_jira.py). It answers "could not read the query" for anything else, such as
# OR or `in (...)`, which the real Jira reads. Such a query can only be tried against the real sandbox, by a person.

format: jira-saved-queries/1

# How many items to ask Jira for in each page, from 1 to 100. Jira may send fewer.
page_size: 10

# The only projects a query may be run against. DEMO is the made-up project. SCRUM is the Jira sandbox.
allowed_projects:
  - DEMO
  - SCRUM

queries:
  - name: all-items
    purpose: 'Every item in the project, to check that the count of the whole project is right.'
    filter: 'created >= "1970-01-01"'

  - name: all-stories
    purpose: 'Every story in the project, whatever its status, for a full count of stories.'
    filter: 'issuetype = Story'

  - name: open-stories
    purpose: 'Stories that are not done, to see how much story work is still open.'
    filter: 'issuetype = Story AND statusCategory != Done'

  - name: stories-updated-since
    purpose: 'Stories changed on or after a given date, to see what moved since the last look.'
    filter: 'issuetype = Story AND updated >= {since}'
    parameters:
      since: date

  - name: stories-with-no-such-label
    purpose: 'A query that is meant to match nothing, to show that zero is reported as zero and not as an error.'
    filter: 'issuetype = Story AND labels = no-such-label-zzz'
