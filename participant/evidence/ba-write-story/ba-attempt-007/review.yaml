  from the standard''s vague-word list used in any criterion is "valid", and the story
  defines it. What changed since the first review: the story now has a complete made-up
  test set-up, with a staging address, test cards, the checkout fields and values
  to type, a test account and a test inbox. A blind reader of the final file (round
  4) counted 21 of 21 criteria testable with no question needed, and this matches
  the story''s actual text (AC-08 Then, AC-11 Given). Remaining points are advisory.
  Some waits have no number, AC-08 can be read as two results, and the files are in
  a different folder than the quest names. No injection: the instruction-like meeting
  line U-0016 is sample data, and the story lists it as not used. Each of the 7 acceptance
