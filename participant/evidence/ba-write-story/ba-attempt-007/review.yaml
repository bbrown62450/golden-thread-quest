  names the user and the value, and cites U-0002 for both. - It has 7 out-of-scope
  entries and 7 in-scope entries. Each out-of-scope entry says why it is out and where
  it went. - There are 21 Given/When/Then criteria, numbered AC-01 to AC-21. Each
  has one result that a tester can see or read. - It lists 3 dependencies, each marked
  SAID or ASSUMED. - The recorded check passed with exit code 0. It shows all 47 citations
