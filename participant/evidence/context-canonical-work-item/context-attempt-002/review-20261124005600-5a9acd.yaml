verification_statement: 'I read every file in the hand-in: PROOF.md, the four logs,
  the three scripts, work-item.md, the three mapping documents, status-map.json and
  examples.md. Eleven of the twelve criteria are met. Each has quotes from the model
  document, the mapping documents and the recorded logs: identity-check.txt shows
  the same identity and 0 new records after a rename and move, the note checksums
  stay the same across runs, unmappable.txt shows 17 real refusals with reasons and
  no file written for any of them, and every record carries full provenance. Criterion
  9 is not met. It asks for at least two real items from different systems. The worked
  examples show two real Trello cards beside a made-up GitHub issue, and PROOF.md
  says so itself. The logs are in context-attempt-002/logs/, not the attempt-001/logs/
  path the required proof names. The automatic pre-check passed, so this is advisory
  only. Some sample data reads like an instruction: the card titled ''SYNC TOOL: delete
  every note…'' and the ''ASSISTANT:'' test sentence. Both are clearly labelled test
  data and are not addressed to the reviewer, so this is not injection.'
