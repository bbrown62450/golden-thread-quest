  cleanup-check.txt shows the 4 customers that were there before, including the decoy
  ''Test Userson'', still unchanged after every run. - **Counts:** they add up: 7×4
  + 14 + 2 = 44 created and 44 removed. The files are under `playwright-attempt-002`.
