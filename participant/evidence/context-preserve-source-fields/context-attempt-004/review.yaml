verification_statement: 'Automated review. I read all eight evidence files. Six synthetic
  records came from three systems: Jira, Trello and GitHub. Each system has fields
  the others lack. I compared the normalized records with the source records field
  by field. The preserved values match the source characters exactly, including 3.0,
  1e3, the é escape, the trailing spaces and the empty string beside null. I checked
  the field counts in the check log against field_order and rebuilt_from_canonical,
  for example jira 10042 with 16 preserved and 3 rebuilt. I also checked the rationale
  totals: 11 copied, 15 translated and 31 preserved only, for 57 fields. These all
  agree. The roundtrip log shows all 6 records rebuilt identically with exit code
  0. In part 3, the deliberately dropped customFieldItems line is named and the check
  exits with code 2. The planted-bugs and tests logs back this up. One small difference:
  the evidence folder is named context-attempt-004, not attempt-001 as the required-proof
  paths say. The automatic pre-check still reported the required files as present.
  No text in the evidence is addressed to the reviewer. Each of the 7 acceptance criteria
  was matched to text quoted word for word from the evidence.'
